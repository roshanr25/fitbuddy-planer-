<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ plan.name }}'s Plan | FitBuddy</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f7f6; margin: 0; padding: 2rem; }
        .container { max-width: 800px; margin: 0 auto; background: #fff; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .header { background: #2980b9; color: white; padding: 1rem; border-radius: 4px; margin-bottom: 2rem; text-align: center;}
        .tip-box { background: #f1c40f; padding: 1rem; border-radius: 4px; font-weight: bold; margin-bottom: 2rem; color: #333;}
        .feedback-section { margin-top: 3rem; border-top: 2px solid #eee; padding-top: 1.5rem;}
        textarea { width: 100%; height: 80px; padding: 0.5rem; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { margin-top: 1rem; padding: 0.75rem 1.5rem; background: #8e44ad; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #9b59b6; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h2>{{ plan.name }}'s 7-Day Fitness Plan</h2>
            <p>Goal: {{ plan.goal }} | Intensity: {{ plan.intensity }}</p>
        </div>

        <div class="tip-box">
            💡 <strong>Nutrition/Recovery Tip:</strong> {{ plan.nutrition_tip | markdown | safe }}
        </div>

        <div class="workout-content">
            {{ plan.workout_plan | markdown | safe }}
        </div>

        <div class="feedback-section">
            <h3>Update Your Plan</h3>
            <p>Not quite right? Let FitBuddy refine it for you.</p>
            <form action="/refine/{{ plan.id }}" method="post">
                <textarea name="feedback" placeholder="E.g., Make it more cardio-focused, or give me 2 rest days instead of 1..." required></textarea>
                <button type="submit">Refine Plan with AI</button>
            </form>
        </div>
    </div>
</body>
</html>

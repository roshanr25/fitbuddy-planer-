<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitBuddy | AI Fitness Planner</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f7f6; margin: 0; padding: 2rem; }
        .container { max-width: 600px; margin: 0 auto; background: #fff; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1 { color: #2c3e50; text-align: center; }
        .form-group { margin-bottom: 1rem; }
        label { display: block; margin-bottom: 0.5rem; font-weight: bold; }
        input, select { width: 100%; padding: 0.5rem; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 0.75rem; background: #27ae60; color: white; border: none; border-radius: 4px; font-size: 1rem; cursor: pointer; }
        button:hover { background: #2ecc71; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🏋️ FitBuddy Planner</h1>
        <form action="/generate" method="post">
            <div class="form-group"><label>Name:</label><input type="text" name="name" required></div>
            <div class="form-group"><label>Age:</label><input type="number" name="age" required></div>
            <div class="form-group"><label>Weight (kg):</label><input type="number" step="0.1" name="weight" required></div>
            <div class="form-group">
                <label>Goal:</label>
                <select name="goal">
                    <option value="Weight Loss">Weight Loss</option>
                    <option value="Muscle Gain">Muscle Gain</option>
                    <option value="General Wellness">General Wellness</option>
                </select>
            </div>
            <div class="form-group">
                <label>Intensity:</label>
                <select name="intensity">
                    <option value="Low">Low</option>
                    <option value="Medium">Medium</option>
                    <option value="High">High</option>
                </select>
            </div>
            <button type="submit">Generate My Plan</button>
        </form>
    </div>
</body>
</html>
